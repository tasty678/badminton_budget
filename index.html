  const q=(document.getElementById('fm-contact-search')||{}).value||'';
  const contacts=(D.contacts||[]).filter(c=>!q||c.name.includes(q)||(c.phone||'').includes(q));
  const cl=document.getElementById('fm-contact-list');if(!cl)return;
  cl.innerHTML=contacts.length?contacts.map(c=>`<div class="csl-row" onclick="document.getElementById('fm-name').value='${esc(c.name)}'"><div class="csl-name">${esc(c.name)}</div><div class="csl-sub">${c.phone?esc(c.phone):''}</div></div>`).join(''):'<div style="padding:10px 12px;font-size:13px;color:var(--text3)">找不到</div>';
}
function filterCasualContacts(){
  const q=(document.getElementById('fc-contact-search')||{}).value||'';
  const contacts=(D.contacts||[]).filter(c=>!q||c.name.includes(q)||(c.phone||'').includes(q));
  const cl=document.getElementById('fc-contact-list');if(!cl)return;
  cl.innerHTML=contacts.length?contacts.map(c=>`<div class="csl-row" onclick="document.getElementById('fc-name').value='${esc(c.name)}'"><div class="csl-name">${esc(c.name)}</div><div class="csl-sub">${c.phone?esc(c.phone):''}</div></div>`).join(''):'<div style="padding:10px 12px;font-size:13px;color:var(--text3)">找不到</div>';
}
function filterContacts(){
  const q=(document.getElementById('contacts-search')||{}).value.toLowerCase()||'';
  const contacts=(D.contacts||[]).filter(c=>!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.note||'').toLowerCase().includes(q));
  const el=document.getElementById('contacts-list');if(!el)return;
  el.innerHTML=contacts.length?contacts.map(c=>`
    <div class="contact-row">
      <div class="avatar av-g" style="flex-shrink:0">${esc(c.name.slice(0,1))}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:500;color:var(--text)">${esc(c.name)}</div>
        ${c.phone?`<div style="font-size:11px;color:var(--text3)">${esc(c.phone)}</div>`:''}
        ${(c.platform&&c.note)?`<div style="font-size:11px;color:var(--text3)">${esc(c.platform)}: ${esc(c.note)}</div>`:c.note?`<div style="font-size:11px;color:var(--text3)">${esc(c.note)}</div>`:''}
      </div>
      <button onclick="openContactForm('${c.id}')" class="ia"><i class="ti ti-edit"></i></button>
      <button onclick="if(confirm('確定刪除？')){deleteContactFromFirestore('${c.id}');D.contacts=D.contacts.filter(x=>x.id!=='${c.id}');save();renderContacts();}" class="ia"><i class="ti ti-trash"></i></button>
    </div>`).join(''):'<div style="font-size:13px;color:var(--text3);padding:16px">找不到符合的名單</div>';
}


// ── CALENDAR ──────────────────────────────────────────
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth(),calYearRangeStart=2020;
const TEAM_COLORS_CAL=['#8AAB93','#A1C2CB','#CBAF79','#DF978A','#C9CADE','#AFB99E','#5190A2','#DBC9C4'];
const CAL_MONTHS=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const CAL_MONTHS_S=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function getTeamColor(teamId){
  const idx=D.teams.filter(t=>!t.archived).findIndex(t=>t.id===teamId);
  return TEAM_COLORS_CAL[Math.max(0,idx)%TEAM_COLORS_CAL.length];
}

function getSessionsOnDate(dateStr){
  const results=[];
  for(const t of D.teams.filter(x=>!x.archived)){
    for(const s of(t.seasons||[])){
      const sess=s.sessions.find(x=>x.date===dateStr);
      if(sess)results.push({team:t,sess,color:getTeamColor(t.id)});
    }
  }
  // sort by team name
  results.sort((a,b)=>a.team.name.localeCompare(b.team.name));
  return results;
}

function renderCalendar(){
  const nc=notifCount();
  const now=new Date();
  const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();

  // Build day headers
  let dows='';
  ['日','一','二','三','四','五','六'].forEach((d,i)=>{dows+=`<div class="cal-dow${i===0?' sun':''}">${d}</div>`;});

  // Build cells
  let cells='';
  const totalCells=Math.ceil((firstDay+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    let day,month,year,isOther=false,dateStr;
    if(i<firstDay){day=prevDays-firstDay+i+1;month=calMonth===0?11:calMonth-1;year=calMonth===0?calYear-1:calYear;isOther=true;}
    else if(i>=firstDay+daysInMonth){day=i-firstDay-daysInMonth+1;month=calMonth===11?0:calMonth+1;year=calMonth===11?calYear+1:calYear;isOther=true;}
    else{day=i-firstDay+1;month=calMonth;year=calYear;}
    dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday=dateStr===todayStr;
    const dow=new Date(year,month,day).getDay();
    const sessions=getSessionsOnDate(dateStr);
    const evHtml=sessions.slice(0,3).map(({team,color})=>{
      const bg=color+'28';const tc=color;
      return`<div class="cal-ev" style="background:${bg};color:${tc}"><div class="cal-ev-dot" style="background:${tc}"></div>${esc(team.name)}</div>`;
    }).join('')+(sessions.length>3?`<div style="font-size:9px;color:var(--text3);padding:0 3px">+${sessions.length-3}</div>`:'');
    cells+=`<div class="cal-cell${isOther?' other-month':''}${isToday?' today':''}" onclick="onCalDayClick('${dateStr}')">
      <div class="cal-num${dow===0&&!isToday?' sun':''}">
        ${isToday?`<span class="cal-num" style="background:var(--green);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center">${day}</span>`:day}
      </div>
      <div class="cal-events">${evHtml}</div>
    </div>`;
  }

  document.getElementById('page-calendar').innerHTML=`
    <div class="cal-topbar">
      <button class="cal-nav-btn" onclick="calToday()" style="font-size:12px;font-weight:700;padding:4px 10px;border:1px solid var(--border2);border-radius:20px;color:var(--green)">今天</button>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="calPrev()"><i class="ti ti-arrow-left"></i></button>
        <button class="cal-year-btn" onclick="openCalYearPicker()">${calYear}</button>
        <span class="cal-sep">/</span>
        <button class="cal-month-btn" onclick="openCalMonthPicker()">${String(calMonth+1).padStart(2,'0')}</button>
        <button class="cal-nav-btn" onclick="calNext()"><i class="ti ti-arrow-right"></i></button>
      </div>
      <button class="topbar-acct-btn" onclick="openAcctPanel()" aria-label="帳號"><i class="ti ti-user-circle"></i><span class="tb-notif-dot" style="display:${nc>0?'flex':'none'}">${nc}</span></button>
    </div>
    <div class="cal-grid">${dows}${cells}</div>
    <div style="height:90px"></div>`;
}

function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}
function calToday(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();renderCalendar();}

function onCalDayClick(dateStr){
  const sessions=getSessionsOnDate(dateStr);
  if(!sessions.length)return;
  if(sessions.length===1){route('session',sessions[0].team.id,sessions[0].sess.id);showPage('home');}
  else{
    // show a mini sheet listing sessions that day
    const sheet=document.createElement('div');
    sheet.style.cssText='position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-radius:20px 20px 0 0;z-index:300;padding:16px';
    sheet.innerHTML=`<div style="width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 12px"></div>
      <div style="font-size:16px;font-weight:700;margin-bottom:12px">${dateStr} 的場次</div>
      ${sessions.map(({team,color})=>`<div onclick="this.closest('div[style]').remove();document.getElementById('overlay-daysheet').remove();route('session','${team.id}','${team.seasons.flatMap(s=>s.sessions).find(x=>x.date==='${dateStr}')?.id}');showPage('home')" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer">
        <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></div>
        <div style="font-size:14px;font-weight:500;color:var(--text)">${esc(team.name)}</div>
      </div>`).join('')}
      <button onclick="this.closest('div[style]').remove();document.getElementById('overlay-daysheet').remove()" style="width:100%;padding:10px;margin-top:10px;background:none;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;cursor:pointer;font-family:'Noto Sans TC',sans-serif">取消</button>`;
    const ov=document.createElement('div');ov.id='overlay-daysheet';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:299';
    ov.onclick=()=>{ov.remove();sheet.remove();};
    document.body.appendChild(ov);document.body.appendChild(sheet);
  }
}

function openCalYearPicker(){
  calYearRangeStart=calYear-6;renderCalYearGrid();
  document.getElementById('cal-year-overlay').classList.add('open');
}
function shiftCalYearRange(n){calYearRangeStart+=n;renderCalYearGrid();}
function renderCalYearGrid(){
  document.getElementById('cal-year-range').textContent=`${calYearRangeStart} – ${calYearRangeStart+11}`;
  const g=document.getElementById('cal-year-grid');g.innerHTML='';
  for(let y=calYearRangeStart;y<calYearRangeStart+12;y++){
    const c=document.createElement('div');c.className='cal-picker-cell'+(y===calYear?' active':'');
    c.textContent=y;c.onclick=()=>{calYear=y;document.getElementById('cal-year-overlay').classList.remove('open');renderCalendar();};
    g.appendChild(c);
  }
}
function openCalMonthPicker(){
  const g=document.getElementById('cal-month-grid');g.innerHTML='';
  CAL_MONTHS_S.forEach((m,i)=>{
    const c=document.createElement('div');c.className='cal-picker-cell'+(i===calMonth?' active':'');
    c.textContent=m;c.onclick=()=>{calMonth=i;document.getElementById('cal-month-overlay').classList.remove('open');renderCalendar();};
    g.appendChild(c);
  });
  document.getElementById('cal-month-overlay').classList.add('open');
}


// ── SHARING ──────────────────────────────────────────
let _shareTeamId=null;
function openSharePanel(teamId){
  _shareTeamId=teamId;
  const t=D.teams.find(x=>x.id===teamId);if(!t)return;
  document.getElementById('sh-editor-email').value='';
  document.getElementById('sh-viewer-email').value='';
  renderShareList(t);
  openOv('ov-share');
}
function renderShareList(t){
  const el=document.getElementById('sh-current-list');if(!el)return;
  const editors=t.editors||[];const viewers=t.viewers||[];
  if(!editors.length&&!viewers.length){el.innerHTML='<div style="font-size:13px;color:var(--text3)">尚未共享給任何人</div>';return;}
  el.innerHTML=`<label class="fl">目前共享名單</label>`+
    [...editors.map(e=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1"><div style="font-size:13px;color:var(--text)">${esc(e)}</div><div style="font-size:11px;color:var(--text3)">可編輯</div></div>
      <button onclick="removeShareMember('editor','${e}')" class="btn-ds">移除</button>
    </div>`),
    ...viewers.map(e=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1"><div style="font-size:13px;color:var(--text)">${esc(e)}</div><div style="font-size:11px;color:var(--text3)">只能看</div></div>
      <button onclick="removeShareMember('viewer','${e}')" class="btn-ds">移除</button>
    </div>`)
  ].join('');
}
async function addShareMember(role){
  const emailEl=document.getElementById(role==='editor'?'sh-editor-email':'sh-viewer-email');
  const email=emailEl.value.trim().toLowerCase();
  if(!email||!email.includes('@')){alert('請輸入正確的 email');return;}
  const t=D.teams.find(x=>x.id===_shareTeamId);if(!t)return;
  if(!t.editors)t.editors=[];if(!t.viewers)t.viewers=[];
  if(role==='editor'&&!t.editors.includes(email))t.editors.push(email);
  if(role==='viewer'&&!t.viewers.includes(email))t.viewers.push(email);
  emailEl.value='';
  await save();
  renderShareList(t);
}
async function removeShareMember(role,email){
  const t=D.teams.find(x=>x.id===_shareTeamId);if(!t)return;
  if(role==='editor')t.editors=(t.editors||[]).filter(e=>e!==email);
  if(role==='viewer')t.viewers=(t.viewers||[]).filter(e=>e!==email);
  await save();
  renderShareList(t);
}

load();
// Don't auto-login from localStorage anymore - Firebase onAuthStateChanged handles it

function googleLogin(){
  const err = document.getElementById('l-err');
  err.style.display = 'none';
  if(!window._fbSignIn){
    err.style.display = 'block';
    err.textContent = 'Firebase 載入中，請稍後再試';
    return;
  }
  window._fbSignIn().catch(e => {
    err.style.display = 'block';
    err.textContent = '登入失敗：' + (e.message || e.code || '請再試一次');
  });
}
